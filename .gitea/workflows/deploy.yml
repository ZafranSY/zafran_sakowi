name: Deploy Portfolio

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          echo "🔨 Building Docker image..."
          docker build -t zafran-sakowi-app:latest .
          echo "✅ Docker image built successfully"

      - name: Deploy container
        run: |
          echo "🚀 Deploying new container..."

          # Stop and remove old container if it exists
          docker stop zafran-sakowi-app || true
          docker rm zafran-sakowi-app || true

          # Start the new container
          docker run -d \
            --name zafran-sakowi-app \
            --restart always \
            --network homelab \
            -p 3000:3000 \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e HOSTNAME=0.0.0.0 \
            zafran-sakowi-app:latest

          echo "✅ Container started successfully"

      - name: Health check
        run: |
          echo "🏥 Waiting for app to be ready..."
          sleep 10
          # Try to hit the container to confirm it's up
          docker exec zafran-sakowi-app wget --no-verbose --tries=3 --spider http://localhost:3000 && \
            echo "✅ App is live on port 3000!" || \
            echo "⚠️ App may still be starting up, check: docker logs zafran-sakowi-app"

      - name: Cleanup old images
        run: |
          docker image prune -f
          echo "🧹 Cleaned up dangling images"
